onboarding = false

[ui]
status_indicators = "symbols"
host_cursor = "native"
sidebar_collapsed_mode = "hidden"

[keys]
prefix = "ctrl+t"
workspace_picker = "prefix+w"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
focus_agent = "prefix+alt+1..9"
move_tab_previous = "prefix+shift+left"
move_tab_next = "prefix+shift+right"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "Open agent-touched file"

[theme]
# Herdr uses terminal colors as a base, with Kanso Ink overrides.
name = "terminal"
auto_switch = false

[theme.custom]
panel_bg = "#14171d"
sidebar_bg = "#14171d"
active_row_bg = "#22262D"
selection_bg = "#393B44"
surface0 = "#1f1f26"
surface1 = "#22262D"
surface_dim = "#14171d"
overlay0 = "#4b4e57"
overlay1 = "#909398"
text = "#C5C9C7"
subtext0 = "#A4A7A4"
accent = "#8BA4B0"
mauve = "#A292A3"
green = "#8A9A7B"
yellow = "#C4B28A"
red = "#C4746E"
blue = "#8BA4B0"
teal = "#8EA4A2"
peach = "#B6927B"

[ui.toast]
delivery = "terminal"
