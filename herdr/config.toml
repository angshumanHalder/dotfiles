onboarding = false

[ui]
status_indicators = "symbols"
host_cursor = "native"
sidebar_collapsed_mode = "hidden"

[keys]
prefix = "ctrl+t"
workspace_picker = "prefix+w"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
focus_agent = "prefix+alt+1..9"
move_tab_previous = "prefix+shift+left"
move_tab_next = "prefix+shift+right"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "Open agent-touched file"

[theme]
# Herdr requires a built-in base; custom colors use Kanagawa Dragon.
name = "kanagawa"
auto_switch = false

[theme.custom]
panel_bg = "#181616"
sidebar_bg = "#181616"
active_row_bg = "#282727"
selection_bg = "#223249"
surface0 = "#282727"
surface1 = "#393836"
surface_dim = "#12120F"
overlay0 = "#625E5A"
overlay1 = "#7A8382"
text = "#C5C9C5"
subtext0 = "#C8C093"
accent = "#C4746E"
mauve = "#A292A3"
green = "#8A9A7B"
yellow = "#C4B28A"
red = "#C4746E"
blue = "#8BA4B0"
teal = "#8EA4A2"
peach = "#B6927B"

[ui.toast]
delivery = "terminal"
