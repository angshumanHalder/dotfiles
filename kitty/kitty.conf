font_family JetBrainsMono Nerd Font Mono
font_size 12
font_features JetBrainsMonoNerdFontMono +calt +liga +ss01

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# hide_window_decorations yes
# tab_bar_style hidden
tab_bar_edge top
macos_option_as_alt both

# Ghostty's default padding (2pt): keeps the edge cells, e.g. Neovim's command
# line, clear of the rounded window corners.
window_padding_width 2

include themes/kanso_ink.conf

# Tabs: the theme gives active and inactive tabs the same background.
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #0d0f13
active_tab_background #8ba4b0
active_tab_foreground #14171d
active_tab_font_style bold
inactive_tab_background #22262D
inactive_tab_foreground #A4A7A4

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
cursor none
