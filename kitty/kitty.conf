font_family JetBrainsMono Nerd Font Mono
font_size 12
font_features JetBrainsMonoNerdFontMono +calt +liga +ss01

background_opacity 0.95
background_blur 20

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

hide_window_decorations yes
# tab_bar_style hidden
tab_bar_edge top
macos_option_as_alt both

# Scrollback in Neovim (kitty/scrollback.lua): vim motions, search, y to copy, q to close.
scrollback_pager nvim --clean -c "lua dofile(vim.env.HOME .. '/.config/kitty/scrollback.lua')" -c "lua Scrollback(INPUT_LINE_NUMBER, CURSOR_LINE, CURSOR_COLUMN)"

# Ghostty's default padding (2pt): keeps the edge cells, e.g. Neovim's command
# line, clear of the rounded window corners.
window_padding_width 2

include themes/kanso_ink.conf

# Tabs: the theme gives active and inactive tabs the same background.
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #0d0f13
active_tab_background #8ba4b0
active_tab_foreground #14171d
active_tab_font_style bold
inactive_tab_background #22262D
inactive_tab_foreground #A4A7A4

# Projects: one session (Neovim tab + shell tab) per project, see project.sh.
# The tab bar shows only the current project's tabs (plus the active tab).
tab_bar_filter session:~
# Always show the tab bar, even when a project has a single tab left.
tab_bar_min_tabs 1
# Start in the "home" session (home.kitty-session) so no tab is outside a session.
startup_session home.kitty-session

# Splits: choose the direction per split (stack = zoom one window, ctrl+shift+l).
enabled_layouts splits,stack
# Kanso ink line colour, like Neovim's WinSeparator (the theme sets no borders).
active_border_color #4b4e57
inactive_border_color #22262D
bell_border_color #22262D
# tmux-style prefix ctrl+b; ctrl+b twice sends ctrl+b itself (Neovim page up).
# New tabs and splits open in the current folder and join the current project.
map ctrl+b>t new_tab_with_cwd
# kitty's own new tab/window keys open outside any project (lost once you
# switch project), so ctrl+b is the only way to open tabs and splits.
map cmd+t no_op
map cmd+enter no_op
map cmd+n no_op
map ctrl+shift+t no_op
map ctrl+shift+enter no_op
map ctrl+shift+n no_op
map ctrl+b>v launch --location=vsplit --cwd=current
map ctrl+b>s launch --location=hsplit --cwd=current
map ctrl+b>h neighboring_window left
map ctrl+b>j neighboring_window down
map ctrl+b>k neighboring_window up
map ctrl+b>l neighboring_window right
map ctrl+b>ctrl+b send_key ctrl+b
map ctrl+b>1 goto_tab 1
map ctrl+b>2 goto_tab 2
map ctrl+b>3 goto_tab 3
map ctrl+b>4 goto_tab 4
map ctrl+b>5 goto_tab 5
map ctrl+b>6 goto_tab 6
map ctrl+b>7 goto_tab 7
map ctrl+b>8 goto_tab 8
map ctrl+b>9 goto_tab 9
map ctrl+b>p launch --type=overlay --allow-remote-control sh -c '"$HOME/.config/kitty/project.sh"'
map ctrl+b>w launch --type=overlay --allow-remote-control sh -c '"$HOME/.config/kitty/sessions.sh"'
map ctrl+b>x close_session .
map ctrl+b>o goto_session -1
cursor none
