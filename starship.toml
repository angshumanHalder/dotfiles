# 1. Turn off the language and package versions to save space
[package]
disabled = true

[rust]
disabled = true

[golang]
disabled = true
# (You can also add [golang], [zig], [python] etc., with disabled = true if they pop up elsewhere)

[custom.jj]
when = 'd=$PWD; while [ -n "$d" ]; do [ -d "$d/.jj" ] && exit 0; d=${d%/*}; done; exit 1'
shell = ["zsh"]
command = "jj-starship"
format = "$output "

[git-commit]
only_detached = false
