# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

#---------------------------------------------------------------

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -ga terminal-overrides ",tmux-256color:Tc"
set -g allow-passthrough on
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys'

# Kanso Ink colors
set -g status-style "bg=#14171d fg=#C5C9C7"
set -g status-left-style "bg=#14171d fg=#8A9A7B bold"
set -g status-right "#[fg=#B98D7B]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null)#[fg=#A292A3] #S "
set -g status-right-length 60
set -g status-interval 5
set -g window-status-style "bg=#14171d fg=#C5C9C7"
set -g window-status-current-style "bg=#393B44 fg=#C5C9C7 bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g pane-border-style "fg=#C4B28A"
set -g pane-active-border-style "fg=#C5C9C7"
set -g message-style "bg=#14171d fg=#C5C9C7"

set -g prefix C-t
unbind C-b
bind-key C-t send-prefix

setw -g mouse on

bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
unbind l
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r -T prefix       Up              resize-pane -U 5
bind-key -r -T prefix       Down            resize-pane -D 5
bind-key -r -T prefix       Left            resize-pane -L 5
bind-key -r -T prefix       Right           resize-pane -R 5

bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s 1 

bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

bind-key C-o rotate-window

set-option -g default-command "/bin/bash -c 'which reattach-to-user-namespace >/dev/null && exec reattach-to-user-namespace $SHELL -l || exec $SHELL -l'"
set-option -g renumber-windows on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
